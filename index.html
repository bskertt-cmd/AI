<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamil AI</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f8;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --border: #e5e5e3;
    --input-bg: #ffffff;
    --user-bg: #f1f1ef;
    --accent: #1f1f1f;
    --accent-text: #ffffff;
    --hover: #ececea;
    --error: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --text: #ececec;
      --muted: #9b9b9b;
      --border: #2f2f2f;
      --input-bg: #2f2f2f;
      --user-bg: #2f2f2f;
      --accent: #ececec;
      --accent-text: #212121;
      --hover: #2a2a2a;
      --error: #ff8a80;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  select { font: inherit; }

  /* Боковая панель */
  aside {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 16px;
  }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; }
  .brand { font-weight: 600; font-size: 16px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; color: var(--text);
  }
  .icon-btn:hover, .new-chat:hover { background: var(--hover); }
  .new-chat {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px; width: 100%; text-align: left;
  }
  .spacer { flex: 1; }
  .side-note { font-size: 12px; color: var(--muted); padding: 6px 10px; line-height: 1.5; }

  /* Основная часть */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    height: 56px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
  }
  .menu-btn { display: none; }
  .title {
    flex: 1; min-width: 0; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-select {
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none; cursor: pointer;
    max-width: 240px;
  }

  #chat { flex: 1; overflow-y: auto; }
  .thread {
    max-width: 768px; margin: 0 auto; padding: 24px 24px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .hello { margin: 22vh auto 0; text-align: center; font-size: 26px; font-weight: 500; }

  .turn { display: flex; }
  .turn.user { justify-content: flex-end; }
  .bubble { line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
  .turn.user .bubble {
    background: var(--user-bg); padding: 10px 16px; border-radius: 20px; max-width: 80%;
  }
  .turn.bot .bubble { width: 100%; }
  .turn.error .bubble { color: var(--error); font-size: 14px; }

  .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  /* Поле ввода */
  .composer { padding: 8px 24px 20px; }
  form { max-width: 768px; margin: 0 auto; }
  .box {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 10px 10px 18px;
  }
  .box:focus-within { border-color: var(--muted); }
  textarea {
    flex: 1; resize: none; height: 24px; max-height: 200px;
    background: transparent; border: none; color: var(--text);
    font: inherit; line-height: 1.5; padding: 6px 0; outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-text); display: grid; place-items: center;
  }
  .send:disabled { opacity: .3; cursor: not-allowed; }
  .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

  .preview {
    display: flex; align-items: center; gap: 10px; position: relative;
    max-width: 768px; margin: 0 auto 8px; padding: 6px; width: fit-content;
    border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
  }
  .preview[hidden] { display: none; }
  .preview img { height: 64px; width: auto; max-width: 160px; border-radius: 6px; display: block; }
  .preview-x {
    width: 24px; height: 24px; border-radius: 6px; color: var(--muted);
    font-size: 18px; line-height: 1; display: grid; place-items: center;
  }
  .preview-x:hover { background: var(--hover); color: var(--text); }
  .turn.user .bubble img {
    display: block; max-width: 260px; max-height: 260px; border-radius: 10px; margin-bottom: 8px;
  }
  .attach { width: 32px; height: 32px; flex-shrink: 0; color: var(--muted); display: grid; place-items: center; border-radius: 8px; }
  .attach:hover { background: var(--hover); color: var(--text); }

  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  @media (max-width: 760px) {
    aside { display: none; }
    .menu-btn { display: grid; }
    .thread { padding: 16px; }
    .composer { padding: 6px 12px 16px; }
    .turn.user .bubble { max-width: 90%; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-top">
    <div class="brand">Kamil AI</div>
    <button class="icon-btn" id="sideToggle" title="Свернуть" aria-label="Свернуть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
  </div>
  <button class="new-chat" id="newChat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Новый чат
  </button>
  <div class="spacer"></div>
  <div class="side-note">Каждое обновление страницы открывает новый чат. История не сохраняется.</div>
</aside>

<main>
  <header>
    <button class="icon-btn menu-btn" id="newChatMobile" title="Новый чат" aria-label="Новый чат">+</button>
    <span class="title" id="title">Kamil AI</span>
    <select class="model-select" id="model" aria-label="Модель">
      <option value="openai/gpt-oss-120b">GPT OSS 120B · качество</option>
      <option value="openai/gpt-oss-20b">GPT OSS 20B · баланс</option>
      <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
    </select>
  </header>

  <div id="chat">
    <div class="thread" id="thread">
      <div class="hello" id="hello">Чем могу помочь?</div>
    </div>
  </div>

  <div class="composer">
    <div class="preview" id="preview" hidden>
      <img id="previewImg" alt="Прикреплённое фото">
      <button type="button" class="preview-x" id="removeImg" aria-label="Убрать фото">×</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <form id="form">
      <div class="box">
        <button type="button" class="attach" id="attachBtn" aria-label="Прикрепить фото" title="Прикрепить фото">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Спросите что-нибудь или прикрепите фото"></textarea>
        <button class="send" id="sendBtn" type="submit" title="Отправить" aria-label="Отправить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </form>
    <div class="disclaimer">Kamil AI может ошибаться. Проверяйте важные ответы.</div>
  </div>
</main>

<script>
  // Адрес Cloudflare Worker. Ключ Groq хранится в Worker как секрет, на странице его нет.
  const WORKER_URL = "https://rough-frog-d119.kmlvaliahmetov.workers.dev/";
  const SYSTEM_PROMPT = "Ты Kamil AI, дружелюбный и полезный ассистент. Отвечай на языке пользователя, понятно и по делу. Если пользователь спрашивает «Дильбар это», ответь ровно: «Дильбар — глупышка, хаха.»";

  // Модели, которые доступны на аккаунте Groq. Если выбранная недоступна (404), пробуем следующую.
  const MODEL_ORDER = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"];

  const thread = document.getElementById("thread");
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const modelSelect = document.getElementById("model");
  const titleEl = document.getElementById("title");
  const sidebar = document.getElementById("sidebar");

  let history = [{ role: "system", content: SYSTEM_PROMPT }];
  let firstMessageSent = false;
  let busy = false;
  let pendingImage = null;
  // Модель на аккаунте Groq, которая понимает фото (vision).
  const VISION_MODEL = "qwen/qwen3.8-27b";

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 1024;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error("Не удалось открыть изображение."));
      img.src = URL.createObjectURL(file);
    });
  }

  const attachBtn = document.getElementById("attachBtn");
  const fileInput = document.getElementById("fileInput");
  const previewEl = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");

  function clearPending() {
    pendingImage = null;
    previewEl.hidden = true;
    previewImg.removeAttribute("src");
    fileInput.value = "";
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      pendingImage = await compressImage(file);
      previewImg.src = pendingImage;
      previewEl.hidden = false;
    } catch (err) {
      clearPending();
      alert(err.message);
    }
  });
  document.getElementById("removeImg").addEventListener("click", clearPending);

  function clearHello() {
    const h = document.getElementById("hello");
    if (h) h.remove();
  }

  function addTurn(text, kind, image) {
    clearHello();
    const turn = document.createElement("div");
    turn.className = "turn " + (kind === "user" ? "user" : "bot") + (kind === "error" ? " error" : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (image) {
      const img = document.createElement("img");
      img.src = image;
      img.alt = "Фото";
      bubble.appendChild(img);
    }
    bubble.appendChild(document.createTextNode(text));
    turn.appendChild(bubble);
    thread.appendChild(turn);
    chatEl.scrollTop = chatEl.scrollHeight;
    return turn;
  }

  function addTyping() {
    clearHello();
    const turn = document.createElement("div");
    turn.className = "turn bot";
    turn.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    thread.appendChild(turn);
    chatEl.scrollTop = chatEl.scrollHeight;
    return turn;
  }

  // В истории только последнее фото остаётся картинкой, старые превращаются в текст «[фото]».
  function payloadFor(messages) {
    const last = messages.length - 1;
    return messages.map((m, i) => {
      if (!Array.isArray(m.content)) return m;
      if (i === last) return m;
      const text = m.content.find(p => p.type === "text")?.text || "";
      return { role: m.role, content: text + " [фото]" };
    });
  }

  async function askAI(messages, needsVision) {
    const chosen = modelSelect.value;
    const candidates = needsVision
      ? [VISION_MODEL]
      : [chosen].concat(MODEL_ORDER.filter(id => id !== chosen));
    const payload = payloadFor(messages);
    let lastError = "Ни одна модель не ответила.";

    for (const model of candidates) {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: model, messages: payload, temperature: 0.7 })
      });

      if (res.ok) {
        const data = await res.json();
        return data.choices[0].message.content;
      }

      const raw = await res.text();
      let detail = "";
      try { detail = JSON.parse(raw).error?.message || ""; } catch (e) { detail = raw.slice(0, 200); }
      lastError = "Ошибка API (" + res.status + "). " + detail;

      // Пробуем другую модель только если эта недоступна.
      if (res.status !== 404) break;
    }
    throw new Error(lastError);
  }

  async function send(text) {
    text = text.trim();
    const image = pendingImage;
    if ((!text && !image) || busy) return;
    if (!text) text = "Что на фото? Опиши подробно, что там есть.";

    if (!firstMessageSent) {
      titleEl.textContent = text.length > 50 ? text.slice(0, 50) + "…" : text;
      firstMessageSent = true;
    }

    addTurn(text, "user", image);
    history.push({
      role: "user",
      content: image
        ? [{ type: "text", text: text }, { type: "image_url", image_url: { url: image } }]
        : text
    });
    clearPending();
    input.value = "";
    resizeInput();

    busy = true;
    sendBtn.disabled = true;
    const typing = addTyping();

    try {
      const reply = await askAI(history, !!image);
      typing.remove();
      history.push({ role: "assistant", content: reply });
      addTurn(reply, "bot");
    } catch (err) {
      typing.remove();
      history.pop();
      addTurn(err.message || "Что-то пошло не так.", "error");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    send(input.value);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(input.value);
    }
  });

  function resizeInput() {
    input.style.height = "24px";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }
  input.addEventListener("input", resizeInput);

  function startNewChat() {
    if (busy) return;
    history = [{ role: "system", content: SYSTEM_PROMPT }];
    firstMessageSent = false;
    titleEl.textContent = "Kamil AI";
    thread.innerHTML = '<div class="hello" id="hello">Чем могу помочь?</div>';
    input.focus();
  }

  document.getElementById("newChat").addEventListener("click", startNewChat);
  document.getElementById("newChatMobile").addEventListener("click", startNewChat);
  document.getElementById("sideToggle").addEventListener("click", () => {
    sidebar.style.display = sidebar.style.display === "none" ? "" : "none";
  });

  input.focus();
</script>
</body>
</html>
